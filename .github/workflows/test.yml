name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements.txt pins the CUDA wheel for Windows; CI runs tests on the CPU build.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|--extra-index-url)' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
          if [ -f requirements-inference.txt ]; then
            python -m pip install -r requirements-inference.txt
          fi

      # ubuntu-latest ships gcc, so the C inference tests run instead of skipping.
      - name: Run tests
        run: python -m pytest tests/ -q -rs

  # cli/ will move to its own repository, so it must build and test without
  # Python and without paths outside cli/ (fixtures/ stand in for the exporter).
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check cli/ is self-contained
        run: |
          if grep -rnE '\.\./\.\.|\.\./(src|data|models|tests|docs)/' cli; then
            echo "cli/ must not reference files outside cli/"
            exit 1
          fi

      - name: Build and test
        run: make -C cli all test
